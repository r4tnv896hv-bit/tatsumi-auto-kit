<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thumbnail</title>
<style>
  /* 1280x720 の文字だけのサムネイル。{{...}} は render_thumbnail.py が置きかえる */
  :root { --bg: {{BG}}; --fg: {{FG}}; --accent: {{ACCENT}}; --sub: {{SUB}}; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Meiryo", "Noto Sans CJK JP", sans-serif;
    font-weight: 800; color: var(--fg); position: relative;
  }
  .hl { color: var(--accent); }
  .small { font-size: 40px; color: var(--sub); font-weight: 700; }

  /* A: 中央に大きな文字（白背景・いちばん無難） */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 40px 60px; }
  .center .line { font-size: {{SIZE}}px; line-height: 1.12; letter-spacing: -0.02em; }
  .center .bar { width: 220px; height: 14px; background: var(--accent); border-radius: 7px; margin-top: 10px; }
  .center .badge { position: absolute; top: 36px; right: 40px; background: var(--accent); color: #fff;
                   font-size: 54px; padding: 10px 30px; border-radius: 16px; transform: rotate(4deg); }

  /* B: 左に大きな数字のブロック、右に文字 */
  .split { position: absolute; inset: 0; display: grid; grid-template-columns: 430px 1fr; }
  .split .left { background: var(--accent); color: #fff; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; text-align: center; }
  .split .left .big { font-size: 230px; line-height: 1; }
  .split .left .unit { font-size: 64px; }
  .split .right { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 56px; }
  .split .right .line { font-size: {{SIZE}}px; line-height: 1.12; }

  /* C: 暗い背景＋上下の帯（目立たせたいとき） */
  .band { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
          align-items: center; text-align: center; gap: 16px; }
  .band .top, .band .bottom { position: absolute; left: 0; right: 0; height: 90px; background: var(--accent);
          color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .band .top { top: 0; } .band .bottom { bottom: 0; }
  .band .line { font-size: {{SIZE}}px; line-height: 1.12; text-shadow: 0 6px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
